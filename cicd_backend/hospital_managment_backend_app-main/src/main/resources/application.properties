# ======= Server Configuration =======
server.port=6060
server.servlet.context-path=/api

# ======= Spring Configuration =======
spring.main.allow-bean-definition-overriding=true

# ======= MySQL Database Configuration =======
spring.datasource.url=jdbc:mysql://localhost:3306/hospital_db
spring.datasource.username=hospital_user
spring.datasource.password=StrongPassword123!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate configs
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ======= JWT Configuration =======
app.jwt.secret=hospitalSecretKey123456789012345678901234567890123456789012345678901234567890
app.jwt.expiration=86400000

# ======= CORS Configuration =======
spring.web.cors.allowed-origins=https://hospital-managment-frontned-app.vercel.app
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# ======= Logging =======
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.example.demo=DEBUG
logging.level.org.springframework.security=DEBUG
